apiVersion: v1
kind: Service
metadata:
  name: nodejs-backend-service
spec:
  type: NodePort # Exposes the service on a static port on the cluster node
  selector:
    app: nodejs-backend
  ports:
    - port: 3000        # Port exposed inside cluster
      targetPort: 3000  # Port target on the container
      nodePort: 30080   # Port you can open in your browser